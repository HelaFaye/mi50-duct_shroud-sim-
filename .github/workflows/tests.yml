name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile checked-in Python modules
        run: python -m compileall -q analysis scripts tests

      - name: Check generated site data is current
        run: python scripts/build_site_data.py --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run browser-module tests
        run: node --test site/tests/*.test.mjs
